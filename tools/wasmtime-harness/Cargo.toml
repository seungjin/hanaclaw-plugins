[package]
name = "wasmtime-harness"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
rustls = "0.23.46"
rustls-native-certs = "0.8.5"
wasmtime = { version = "48", features = ["anyhow", "component-model", "std"] }
wasmtime-wasi = { version = "48", features = ["p2"] }
