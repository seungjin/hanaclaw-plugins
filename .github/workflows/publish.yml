# Publish validated plugin zips and the refreshed registry.json on main.
#
# Flow (mirrors zeroclaw-plugins' publish.yml, minus its Check-Run
# attestation; see "Deviations" in README.md):
#
#   1. reuse validate.yml as the gate for this exact commit,
#   2. skip if main already moved while validation ran,
#   3. upload missing zips with tools/publish_plugins.py --no-commit, which
#      also refuses to overwrite different bytes and re-verifies every URL,
#   4. commit *only* registry.json and fast-forward main, refusing if main
#      moved in the meantime (the regenerated bytes are never rebased).
#
# A digest written here can never be corrected later: name@version is
# immutable, so the pinned packager image is used for every sha256.
name: Publish plugin registry

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-plugin-registry
  cancel-in-progress: false

jobs:
  validate:
    name: Validate merged source
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  publish:
    name: Publish validated artifacts
    needs: [validate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Keep the bot token out of the remote: pushing uses GH_TOKEN.
          persist-credentials: false
          fetch-depth: 0
      - name: Skip a superseded source revision
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main=$(git rev-parse refs/remotes/origin/main)
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping superseded $GITHUB_SHA; current main is $current_main"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download built wasm artifacts
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wasm-shard-*
          path: staged
          merge-multiple: true
      - name: Stage wasm files beside manifests
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== downloaded artifact tree ==="
          find staged -type f | sort || true
          readarray -d '' -t wasms < <(find staged -type f -name '*.wasm' -print0)
          if [[ "${#wasms[@]}" -eq 0 ]]; then
            echo "::warning::No wasm artifacts found in staged/"
          fi
          for wasm in "${wasms[@]}"; do
            plugin=$(basename "$(dirname "$wasm")")
            wasm_path=$(python3 -c "import tomllib; print(tomllib.loads(open(f'plugins/$plugin/manifest.toml', 'r').read())['wasm_path'])")
            target="plugins/$plugin/$wasm_path"
            mkdir -p "plugins/$plugin"
            cp "$wasm" "$target"
            echo "collected $plugin -> $target"
          done
          echo "=== copied wasm files ==="
          ls -l plugins/*/*.wasm || true
      - name: Download validated registry dry run
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-dry-run
          path: dist
      - name: Verify the dry run matches this commit
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        # The packaged zips must be exactly what this commit produces; a
        # mismatch means the artifact is stale and publishing would record a
        # digest the source cannot reproduce.
        run: |
          set -euo pipefail
          tools/ci/run-packager-python.sh tools/build_plugins.py \
            --skip-build --package dist --check --offline
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.freshness.outputs.publish == 'true'
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Publish zips to the release
        if: steps.freshness.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # --no-commit: the commit below must be created with this workflow's
        # identity, on top of the validated GITHUB_SHA, after the freshness
        # guard has been re-checked.
        run: |
          set -euo pipefail
          gh auth status
          uv run --python 3.13 python tools/publish_plugins.py \
            --no-commit --dist dist
      - name: Upload registry.json to the release
        if: steps.freshness.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Publish the registry index as a release asset so installs can use
          # https://github.com/seungjin/hanaclaw-plugins/releases/download/plugins/registry.json
          # in addition to the raw GitHub URL. --clobber replaces an existing
          # asset of the same name; fall back to a plain upload on first use.
          if gh release view plugins --json assets --jq '.assets[].name' | grep -q '^registry.json$'; then
            gh release upload plugins registry.json --clobber
          else
            gh release upload plugins registry.json
          fi
      - name: Commit the refreshed registry index
        if: steps.freshness.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- registry.json; then
            echo "registry.json is already current."
            exit 0
          fi

          git fetch --no-tags origin main
          current_main=$(git rev-parse refs/remotes/origin/main)
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "::error::Main advanced to $current_main after release upload; its publication run must reconcile the verified assets"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- registry.json
          staged=$(git diff --cached --name-only)
          if [[ "$staged" != "registry.json" ]]; then
            echo "::error::Only registry.json may be published, staged: $staged"
            exit 1
          fi
          git commit -m "chore: publish plugin registry entries"

          # Never rebase regenerated bytes onto a newer main: a new push has
          # its own publication run.
          for attempt in 1 2 3; do
            if git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:main; then
              echo "Published registry.json at $(git rev-parse --short HEAD)."
              exit 0
            fi
            git fetch --no-tags origin main
            if git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
              echo "Registry commit reached main despite an ambiguous push response."
              exit 0
            fi
            current_main=$(git rev-parse refs/remotes/origin/main)
            if [[ "$current_main" != "$GITHUB_SHA" ]]; then
              echo "::error::Main advanced to $current_main; refusing to rebase registry bytes from $GITHUB_SHA"
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              break
            fi
            delay=$((attempt * 2))
            echo "Push failed without a main update; retrying $((attempt + 1))/3 in ${delay}s."
            sleep "$delay"
          done

          echo "::error::Could not push registry.json after three attempts"
          exit 1
