# Kept in step with the repository root by `cargo generate`: the generator
# copies this file into every new crate, and CI's check_toolchain.py fails if
# a plugin's copy drifts. Bumping the channel changes published wasm bytes,
# so bump the plugin version at the same time.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["wasm32-wasip2"]
